name: Background checkout worker

on:
  schedule:
    # Every 5 minutes. (GitHub Actions scheduled runs on the free tier can be
    # delayed during periods of high load; the worker is idempotent so delays are safe.)
    - cron: "*/5 * * * *"
  workflow_dispatch: # manual "Run workflow" button

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger background worker
        run: |
          HTTP_CODE=$(curl -s -o /tmp/worker_response.json -w "%{http_code}" \
            -X POST "${APP_URL}/api/cron/process" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 90)
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/worker_response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Worker returned an error status."
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
